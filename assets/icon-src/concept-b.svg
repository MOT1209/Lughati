<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0E8C80"/>
      <stop offset="1" stop-color="#053A36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#E8962E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF4EF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#011F1C" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- back bubble (gold, Latin L) -->
  <g filter="url(#shadow)">
    <path d="M196 214 H520 a92 92 0 0 1 92 92 V510 a92 92 0 0 1 -92 92 H312 L232 676 L250 602 H196 a92 92 0 0 1 -92 -92 V306 a92 92 0 0 1 92 -92 Z" fill="url(#gold)"/>
  </g>
  <text x="358" y="500" text-anchor="middle" font-family="Cairo" font-weight="800" font-size="300" fill="#7A3E05">L</text>
  <!-- front bubble (white, Arabic lam) -->
  <g filter="url(#shadow)">
    <path d="M504 400 H828 a92 92 0 0 1 92 92 V716 a92 92 0 0 1 -92 92 H774 L792 882 L712 808 H504 a92 92 0 0 1 -92 -92 V492 a92 92 0 0 1 92 -92 Z" fill="url(#glass)"/>
  </g>
  <text x="666" y="680" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="300" fill="#0F766E">ل</text>
</svg>
