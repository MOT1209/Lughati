    <text x="512" y="540" text-anchor="middle" font-family="Cairo" font-weight="800" font-size="330" fill="url(#ink)" filter="url(#glow)">لغتي</text>
    <path d="M230 770 C 400 830, 640 830, 800 750" stroke="url(#gold)" stroke-width="30" stroke-linecap="round" fill="none"/>
    <circle cx="812" cy="746" r="22" fill="#FFD978"/>
