<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="bg" cx="0.72" cy="0.42" r="0.95">
      <stop offset="0" stop-color="#11887D"/>
      <stop offset="0.55" stop-color="#0A4E49"/>
      <stop offset="1" stop-color="#04201E"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8962E" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#E8962E"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9F3EA"/>
