  <text x="310" y="205" text-anchor="middle" font-family="Cairo" font-weight="800" font-size="58" fill="#FFFFFF">تعلّم لغة جديدة</text>
  <text x="310" y="275" text-anchor="middle" font-family="Cairo" font-weight="800" font-size="40" fill="#FFD978">بلغتك أنت</text>
  <text x="310" y="330" text-anchor="middle" font-family="Cairo" font-weight="800" font-size="22" fill="#BFE9E1">الألمانية · الإنجليزية · الإسبانية · الفرنسية · التركية</text>
