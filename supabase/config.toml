# Local Supabase stack used by CI (`supabase start` / `supabase db reset`). Hosted settings
# (SMTP, e-mail confirmation, redirect URLs) are configured in the dashboard: see docs/DEPLOYMENT.md.
project_id = "lughati"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/catalog.sql"]

[auth]
enable_signup = true

[auth.email]
enable_confirmations = true
